AWSTemplateFormatVersion: "2010-09-09"
Description: SuporteHub - tabela DynamoDB (single-table) + policy de acesso para a API

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, hml, prod]
    Description: Ambiente. Em prod a proteção contra exclusão fica ligada.

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Resources:
  SuporteHubTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub suportehub-${Environment}
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - { AttributeName: PK,     AttributeType: S }
        - { AttributeName: SK,     AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
        - { AttributeName: GSI3PK, AttributeType: S }
        - { AttributeName: GSI3SK, AttributeType: S }
        - { AttributeName: GSI4PK, AttributeType: S }
        - { AttributeName: GSI4SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        # GSI1: login por e-mail (EMAIL#...) e "meus chamados" (USER#...)
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        # GSI2: fila do agente por status, ordenada por prioridade e antiguidade
        - IndexName: GSI2
          KeySchema:
            - { AttributeName: GSI2PK, KeyType: HASH }
            - { AttributeName: GSI2SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        # GSI3: chamados por responsável (AGENT#id ou AGENT#NONE)
        - IndexName: GSI3
          KeySchema:
            - { AttributeName: GSI3PK, KeyType: HASH }
            - { AttributeName: GSI3SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        # GSI4: chamados por categoria
        - IndexName: GSI4
          KeySchema:
            - { AttributeName: GSI4PK, KeyType: HASH }
            - { AttributeName: GSI4SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      Tags:
        - { Key: app, Value: suportehub }
        - { Key: env, Value: !Ref Environment }

  # Permissões mínimas para a API .NET (anexe à role da API: ECS, Lambda, EC2...)
  ApiAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub suportehub-${Environment}-api-dynamodb
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:BatchGetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:TransactWriteItems
            Resource:
              - !GetAtt SuporteHubTable.Arn
              - !Sub ${SuporteHubTable.Arn}/index/*

Outputs:
  TableName:
    Value: !Ref SuporteHubTable
  TableArn:
    Value: !GetAtt SuporteHubTable.Arn
  StreamArn:
    Value: !GetAtt SuporteHubTable.StreamArn
  ApiPolicyArn:
    Value: !Ref ApiAccessPolicy
